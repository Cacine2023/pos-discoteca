<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>POS Discoteca</title>
<style>
:root{--bg:#14121f;--card:#1e1b30;--card2:#272340;--tx:#f1eefc;--mut:#a29cc0;--pri:#8b7bff;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}input,select{background:var(--card2);color:var(--tx);border:1px solid #3a3560;border-radius:10px;padding:12px;width:100%}
button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;min-height:48px;font-weight:600;cursor:pointer}
button.sec{background:var(--card2)}button.bad{background:#7f1d1d}button:disabled{opacity:.5}
.top{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bad);display:inline-block}.dot.on{background:var(--ok)}
.sp{flex:1}.badge{background:var(--warn);color:#000;border-radius:20px;padding:2px 10px;font-weight:700}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px}@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.cats{display:flex;gap:8px;overflow:auto;padding:8px 0}.chip{background:var(--card2);border-radius:20px;padding:8px 14px;white-space:nowrap;cursor:pointer}.chip.on{background:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.prod{background:var(--card);border-radius:12px;padding:12px;min-height:84px;cursor:pointer;border:1px solid #2e2a4d}.prod b{display:block}.prod span{color:var(--mut)}
.card{background:var(--card);border-radius:12px;padding:14px;margin:12px}.cart .l{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #2e2a4d}
.q{display:flex;gap:6px;align-items:center}.q button{min-height:38px;padding:4px 12px}
.total{font-size:30px;font-weight:800;text-align:center;margin:10px 0}.mut{color:var(--mut)}.ok{color:var(--ok)}.bad-t{color:var(--bad)}
.note{background:#3a2f12;color:#ffe9a8;border-radius:10px;padding:10px;margin:8px 0}.note.err{background:#3b1414;color:#fecaca}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}.mbox{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.f{margin:8px 0}.f label{display:block;color:var(--mut);font-size:13px;margin-bottom:4px}.row{display:flex;gap:8px}.row>*{flex:1}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #2e2a4d;text-align:left;font-size:14px}
.center{max-width:420px;margin:12vh auto;padding:16px}.toast{position:fixed;left:12px;right:12px;bottom:14px;background:var(--card2);padding:12px;border-radius:10px;z-index:30}
@media print{body{background:#fff;color:#000}.top,.wrap,.modal .acts{display:none}.mbox{max-height:none;background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
